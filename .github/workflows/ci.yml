name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: logistika_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        env:
          SECRET_KEY: ci-only-secret-key-with-sufficient-entropy-not-for-production
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: config.settings_test
          POSTGRES_DB: logistika_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          PAYMENTS_ALLOW_MOCK: "True"
          SMS_VERIFICATION_REQUIRED: "False"
          TELEGRAM_ONLY_REGISTRATION: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Backend test suite
        env:
          SECRET_KEY: ci-only-secret-key-with-sufficient-entropy-not-for-production
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: config.settings_test
          POSTGRES_DB: logistika_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          PAYMENTS_ALLOW_MOCK: "True"
          SMS_VERIFICATION_REQUIRED: "False"
          TELEGRAM_ONLY_REGISTRATION: "True"
        run: |
          python manage.py test --verbosity=1
          python -c "import django; django.setup(); from django.test import Client; assert Client().get('/health/').status_code == 200"

  mobile-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Jest tests
        run: npm test -- --passWithNoTests --ci

      - name: ESLint (screens, config, tests)
        run: npm run lint:screens

      - name: Production dependency audit
        run: npm run audit:prod
