services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: logistika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: logistika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
      PAYMENTS_ALLOW_MOCK: "${PAYMENTS_ALLOW_MOCK:-False}"
      SUBSCRIPTIONS_ENFORCED: "${SUBSCRIPTIONS_ENFORCED:-False}"
      SECRET_KEY: ${SECRET_KEY:-compose-development-only-secret-change-before-production}
      SECURE_SSL_REDIRECT: "False"
      SERVE_LOCAL_MEDIA: "${SERVE_LOCAL_MEDIA:-False}"
      TELEGRAM_AUTH_CLIENT_ID: ${TELEGRAM_AUTH_CLIENT_ID:-}
      TELEGRAM_AUTH_CLIENT_SECRET: ${TELEGRAM_AUTH_CLIENT_SECRET:-}
      TELEGRAM_AUTH_REDIRECT_URI: ${TELEGRAM_AUTH_REDIRECT_URI:-}
      TELEGRAM_AUTH_MOBILE_REDIRECT_URI: ${TELEGRAM_AUTH_MOBILE_REDIRECT_URI:-logistika://auth/telegram}
    volumes:
      - ./backend/media:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    command: celery -A config worker -l info
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: logistika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-compose-development-only-secret-change-before-production}
    depends_on:
      - db
      - redis
      - web

  celery-beat:
    build:
      context: ./backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: logistika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-compose-development-only-secret-change-before-production}
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
